[project]
name = "casefile"
version = "0.1.0"
description = "Automated documentary video production system"
authors = [
    { name = "Mohammad Rahim Hojjat Shamami", email = "127956527+mamadhs74@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "sqlmodel>=0.0.22",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "tldextract>=5.3.1",
    "trafilatura>=1.12",
    "pypdf>=5.0",
    "google-genai>=2.16.0",
    "pillow>=12.3.0",
    "kokoro>=0.9.4",
    "soundfile>=0.14.0",
    "huggingface-hub>=1.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not slow'"
markers = [
    "slow: shells out to ffmpeg; excluded from the default run, opt in with -m slow",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
exclude = ["^data/"]

# soundfile and kokoro ship no type stubs and no py.typed marker --
# confirmed by mypy itself (import-untyped), not assumed. This does not
# weaken checking of this project's own code: everything downstream of
# these two imports (packages/voice/kokoro_provider.py) is still
# checked normally against whatever types those calls return.
[[tool.mypy.overrides]]
module = ["soundfile", "kokoro", "kokoro.*"]
ignore_missing_imports = true
